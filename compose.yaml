# labebal: one container, data in a named volume.
#   docker compose up -d --build      -> http://localhost:3000
# Web Bluetooth needs HTTPS (or localhost): publish it through Pangolin / a reverse proxy.
name: labebal
services:
  labebal:
    build: .
    image: labebal:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      LABEBAL_DATA_DIR: /data/pglite
      # Use a real Postgres instead of the embedded one (see the commented service below):
      # DATABASE_URL: postgres://labebal:labebal@postgres:5432/labebal
    volumes:
      - labebal-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/library').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # Optional: real Postgres instead of embedded PGlite. Uncomment, set DATABASE_URL above.
  # postgres:
  #   image: postgres:17
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: labebal
  #     POSTGRES_PASSWORD: labebal
  #     POSTGRES_DB: labebal
  #   volumes:
  #     - labebal-pg:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U labebal"]
  #     interval: 10s
  #     retries: 5

volumes:
  labebal-data:
  # labebal-pg:
