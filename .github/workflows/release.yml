name: Release
# Push a tag such as v0.2.0 (after setting the same version in both packages).
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Versions match the tag
        run: |
          for p in core app; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "packages/$p is $v, the tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: pnpm test
      - run: mkdir out && for p in core app; do (cd packages/$p && pnpm pack --pack-destination ../../out); done
      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && gh release upload "$GITHUB_REF_NAME" out/*.tgz --clobber || gh release create "$GITHUB_REF_NAME" out/*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Trusted publishing: npm accepts this workflow's identity, so no token is stored.
  # Both packages name this repo and release.yml as their trusted publisher on
  # npmjs.com. Only this job can ask for that identity, and it runs no project code.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out
      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN # setup-node's placeholder, so npm uses the workflow identity
          npm install -g npm@11
          v="${GITHUB_REF_NAME#v}"
          for p in core app; do
            name="@labebal/$p"
            if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v is already published"; continue; fi
            npm publish "./out/labebal-$p-$v.tgz" --access public
          done
